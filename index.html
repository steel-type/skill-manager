<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Belt-and-braces CSP. The main process also injects a CSP response
      header (electron/main.ts:attachCsp); both must allow what we need so
      keep them in sync. `'unsafe-inline'` covers React's per-element style
      props; `'unsafe-eval'` is required by Vite's dev runtime and stripped
      from the header in production.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob:; connect-src 'self' ws://localhost:* http://localhost:* https://fonts.googleapis.com https://fonts.gstatic.com https://api.github.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self';"
    />
    <title>Skillbase</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
