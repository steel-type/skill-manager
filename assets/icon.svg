<?xml version="1.0" encoding="UTF-8"?>
<!--
  Source-of-truth icon. Render to .icns via scripts/build-icons.sh
  (qlmanage + sips + iconutil — no external dependencies).

  Concept: a single sketchy "skill card" centred on a terracotta squircle.
  Reads at every size from 16×16 menu-bar to 1024×1024 retina without
  losing the aesthetic — borders stay legible, lines remain distinct.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="14" dy="14" stdDeviation="0" flood-color="#7a3724" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background squircle (terracotta accent matches the in-app --accent) -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" ry="200" fill="#c96442"/>

  <!-- Subtle inner glow so the card has separation from the background -->
  <rect x="40" y="40" width="944" height="944" rx="170" ry="170"
        fill="none" stroke="#a64d2c" stroke-width="6" opacity="0.5"/>

  <!-- Card group, slightly tilted to nail the wireframe's hand-drawn feel -->
  <g transform="rotate(-3 512 512)" filter="url(#cardShadow)">
    <!-- Card body -->
    <rect x="220" y="278" width="584" height="468" rx="48" ry="48"
          fill="#fdfcf8" stroke="#2a2a2a" stroke-width="12"/>
    <!-- Inner card icon (the "skill icon" miniature) -->
    <rect x="288" y="346" width="120" height="120" rx="20" ry="20"
          fill="#f5f3ec" stroke="#2a2a2a" stroke-width="8"/>
    <!-- Skill name placeholder bar (dark, prominent) -->
    <rect x="450" y="364" width="276" height="28" rx="14" fill="#2a2a2a"/>
    <!-- Skill description placeholder (lighter, shorter) -->
    <rect x="450" y="412" width="200" height="22" rx="11" fill="#b8b3a4"/>
    <!-- Body content lines -->
    <rect x="288" y="528" width="436" height="22" rx="11" fill="#b8b3a4"/>
    <rect x="288" y="586" width="356" height="22" rx="11" fill="#b8b3a4"/>
    <rect x="288" y="644" width="220" height="22" rx="11" fill="#b8b3a4"/>
    <!-- Tiny terracotta tag (bottom-right) -->
    <rect x="616" y="644" width="108" height="36" rx="18" fill="#c96442"/>
  </g>
</svg>
